<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEFL Reading Review</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d8dee9;--accent:#4f36c8;--good:#16794d;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1200px;margin:auto;padding:22px 16px 60px}.top{display:flex;gap:10px;align-items:center}.top h1{margin-right:auto}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.secondary{background:#fff;border:1px solid var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-top:13px}.score{font-size:54px;font-weight:950;color:var(--accent)}.q{display:grid;grid-template-columns:220px 1fr;gap:16px}.passage-thumb{width:100%;max-height:260px;object-fit:contain;background:#eef1f6}.opt{padding:9px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.mine{border-color:#e9a49d;background:#fff2f0}.correct{border-color:#79bd98;background:#ecfdf3}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:700px){.q{grid-template-columns:1fr}}
</style></head><body><div class="shell"><div class="top"><h1>Test Review</h1><button class="btn secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div><div id="loading" class="card">Loading review…</div><div id="content" class="hidden"></div></div>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbz2OCsZ2TC7TYejjDqGi8YXn-zh08lq5RHHG-ylnQcxqiyujolfAlv1QMOuLnuzBdtm/exec',SESSION_KEY='toeflReading.studentSession.v2',testId=new URLSearchParams(location.search).get('test');
function sess(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function jsonp(params,cb){const n='cb_'+Math.random().toString(36).slice(2);window[n]=d=>{try{cb(d)}finally{delete window[n];s.remove()}};const s=document.createElement('script');s.src=BACKEND_URL+'?'+new URLSearchParams({...params,callback:n,_:Date.now()});s.onerror=()=>cb({ok:false,error:'Network error'});document.body.appendChild(s)}
function load(){const s=sess();if(!s?.token){location.href='index.html';return}jsonp({action:'studentReview',token:s.token,testId},d=>{if(!d.ok){document.getElementById('loading').textContent=d.error||'Review unavailable.';return}render(d)})}
function render(d){document.getElementById('loading').classList.add('hidden');const c=document.getElementById('content');c.classList.remove('hidden');c.innerHTML=`<div class="card"><h2>${esc(d.title)}</h2><div class="score">${d.score}/${d.totalQuestions}</div><div>${d.percent}%</div></div>`;if(d.reviewMode!=='full')return;(d.questions||[]).forEach(q=>{const opts=q.options.map((o,i)=>{let cls='opt';if(i===q.correctAnswer)cls+=' correct';if(i===q.studentAnswer&&i!==q.correctAnswer)cls+=' mine';const tags=[];if(i===q.correctAnswer)tags.push('Correct answer');if(i===q.studentAnswer)tags.push('Your answer');return `<div class="${cls}"><b>${'ABCD'[i]}.</b> ${esc(o)} ${tags.length?'<span class="muted">— '+tags.join(' / ')+'</span>':''}</div>`}).join('');c.innerHTML+=`<div class="card q"><div><img class="passage-thumb" src="${esc(q.passageImage||'')}" alt="Passage"><div class="muted">${esc(q.passageLabel||q.passageId)}</div></div><div><h3>${q.no}. ${esc(q.question)}</h3>${opts}</div></div>`})}
window.addEventListener('DOMContentLoaded',load);
</script></body></html>
