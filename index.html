<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEFL Reading Practice</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d8dee9;--accent:#4f36c8;--accent2:#7458e8;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:900px;margin:auto;padding:34px 18px}.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:34px;box-shadow:0 16px 36px rgba(79,54,200,.18)}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:0 0 10px}.hero p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(16,24,40,.06)}
.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:800}.field input{padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}
.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:850;cursor:pointer;font:inherit}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;display:inline-block}
.muted{font-size:13px;color:var(--muted);line-height:1.5}.error{color:var(--bad);font-size:13px;font-weight:750;margin-top:10px}.hidden{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <section class="hero">
    <h1>TOEFL Reading Practice</h1>
    <p>Take your test in the lab, then continue or review it from another device.</p>
  </section>

  <div class="grid">
    <section class="card">
      <h2 style="margin-top:0">Student Login</h2>
      <p class="muted">Use the NIM and password provided by your instructor.</p>
      <form id="loginForm" method="post">
        <input type="hidden" name="action" value="login">
        <input type="hidden" id="returnUrl" name="returnUrl" value="">
        <div class="field"><label>NIM</label><input id="nim" name="nim" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <p id="loginStatus" class="error"></p>
    </section>

    <aside class="card">
      <h2 style="margin-top:0">Instructor</h2>
      <p class="muted">Manage accounts, tests, passage images, review settings, and results.</p>
      <a class="btn secondary" href="admin.html">Instructor View →</a>
    </aside>
  </div>
</div>
<script>
const BACKEND_URL='PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';
const SESSION_KEY='toeflReading.studentSession.v2';

function configureForm(){
  if(!BACKEND_URL||BACKEND_URL.includes('PASTE_APPS_SCRIPT')){
    document.getElementById('loginStatus').textContent='Backend URL has not been configured.';
    document.querySelector('#loginForm button').disabled=true;
    return;
  }
  document.getElementById('loginForm').action=BACKEND_URL;
}
window.addEventListener('DOMContentLoaded',()=>{
  configureForm();
  document.getElementById('returnUrl').value=new URL('dashboard.html',location.href).href;
  const loginError=new URLSearchParams(location.search).get('loginError');
  if(loginError){
    document.getElementById('loginStatus').textContent=loginError;
    history.replaceState(null,'',location.pathname);
  }
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(s?.token && new Date(s.expiresAt)>new Date()) location.href='dashboard.html';
  }catch(e){}
});
</script>
</body></html>
